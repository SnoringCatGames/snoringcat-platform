name: Client SDK CI

on:
  push:
    branches: [main]
    paths:
      - 'addons/snoringcat_platform_client/**'
      - '.github/workflows/client-sdk-ci.yml'
  pull_request:
    paths:
      - 'addons/snoringcat_platform_client/**'
      - '.github/workflows/client-sdk-ci.yml'

env:
  # Only GODOT_RELEASE_TAG is live: it builds the download URL and
  # the cache key below. There used to be a GODOT_VERSION alongside
  # it that nothing referenced, which made bumping the version look
  # done while CI kept fetching the old build. Don't reintroduce it.
  GODOT_RELEASE_TAG: 4.7.2-stable

jobs:
  compliance-suite-mock:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_RELEASE_TAG }}-linux

      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -L -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_RELEASE_TAG }}/Godot_v${{ env.GODOT_RELEASE_TAG }}_linux.x86_64.zip"
          unzip /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${{ env.GODOT_RELEASE_TAG }}_linux.x86_64 ~/godot/godot

      - name: Verify Godot
        run: ~/godot/godot --version

      # SP50: the suite used to run only inside the consuming
      # game's smoke test, so this workflow ran no tests at all.
      # run.sh builds the runtime plugin, starts infra/dev,
      # registers a throwaway game, and runs the compliance
      # suite in a minimal Godot project (SDK + GUT + nakama).
      - name: Run compliance suite standalone
        run: GODOT=~/godot/godot bash .github/compliance/run.sh
